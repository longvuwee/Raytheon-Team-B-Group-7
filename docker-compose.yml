services:
  db:
    image: postgres:15
    container_name: firecast-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SE4485!
      POSTGRES_DB: firecast
    ports:
      - "5433:5432"   # host:container
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8.10
    container_name: firecast-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: amerdajani03@gmail.com
      PGADMIN_DEFAULT_PASSWORD: SE4485!
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
